name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CometWorks/quasar
          # Exact 1.6.0.54 source; release cleanup can remove older version tags.
          ref: a1b42b0ab9a00002b46befb9792ffb9321e138a3
          path: deps/quasar
          sparse-checkout: |
            Quasar.Plugin.Abstractions
            Docs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test against minimum Quasar version
        run: >-
          dotnet run --project tests/Koth.Tests/Koth.Tests.csproj -c Release
          -p:QuasarPluginAbstractionsProject="$GITHUB_WORKSPACE/deps/quasar/Quasar.Plugin.Abstractions/Quasar.Plugin.Abstractions.csproj"
