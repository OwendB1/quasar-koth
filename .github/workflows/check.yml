name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CometWorks/quasar
          # Public worker contracts used by the adapter. WASM route acceptance needs Quasar 1.7.
          ref: e02f49d1bee95bdbd3d0931aa6bbb6a372479e57
          path: deps/quasar
          sparse-checkout: |
            Quasar.Plugin.Abstractions
            Docs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build worker and browser and run KOTH checks
        run: >-
          dotnet run --project tests/Koth.Tests/Koth.Tests.csproj -c Release
          -p:QuasarPluginAbstractionsProject="$GITHUB_WORKSPACE/deps/quasar/Quasar.Plugin.Abstractions/Quasar.Plugin.Abstractions.csproj"
